<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>대입 합격 현황</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* 레이아웃: 학생 화면은 한 열 카드 + 하단 고정 실행 막대, 관리자 화면은 요약 숫자 → 필터 → 넓은 표 */
:root{
  --bg:#f2f4f7; --surface:#ffffff; --sunk:#e8ecf1; --ink:#17202b; --muted:#5b6777; --line:#d6dce5;
  --accent:#1c4a78; --accent-ink:#ffffff; --accent-soft:#e1eaf4;
  --seal:#b23a2e; --seal-soft:#f6e4e1;
  --ok:#1b6e44; --ok-soft:#dff0e6; --warn:#8a5a00; --warn-soft:#f5ead2; --bad:#874040; --bad-soft:#f1e2e2;
  --f-display:"Gowun Batang","Nanum Myeongjo","Batang",serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11161d; --surface:#19202a; --sunk:#141a22; --ink:#e5eaf0; --muted:#98a4b3; --line:#2b3441;
  --accent:#7fb0e2; --accent-ink:#0d1622; --accent-soft:#1f2e40;
  --seal:#e06a5e; --seal-soft:#3a2321;
  --ok:#6fcf98; --ok-soft:#18301f; --warn:#e2b45a; --warn-soft:#33291a; --bad:#e39a9a; --bad-soft:#372222;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11161d; --surface:#19202a; --sunk:#141a22; --ink:#e5eaf0; --muted:#98a4b3; --line:#2b3441;
  --accent:#7fb0e2; --accent-ink:#0d1622; --accent-soft:#1f2e40;
  --seal:#e06a5e; --seal-soft:#3a2321;
  --ok:#6fcf98; --ok-soft:#18301f; --warn:#e2b45a; --warn-soft:#33291a; --bad:#e39a9a; --bad-soft:#372222;
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 120px}
h1,h2,h3{text-wrap:balance;margin:0}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)} .small{font-size:13px}
.wrap{max-width:820px;margin:0 auto} .wrap.wide{max-width:1280px}

/* 미리보기 안내 */
.demo{max-width:1280px;margin:12px auto 0;padding:10px 14px;border:1px dashed var(--warn);background:var(--warn-soft);color:var(--warn);border-radius:var(--r);font-size:13px}
.demo b{font-family:var(--f-mono);font-weight:500}

/* 버튼 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:0 18px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn:disabled{opacity:.55;cursor:wait}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.seal{background:var(--seal);border-color:var(--seal);color:#fff}
.btn.ghost{background:transparent}
.btn.sm{min-height:34px;padding:0 12px;font-size:13px}
.btn.danger{color:var(--seal);border-color:var(--seal)}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;padding:6px}

/* 입력 */
input,select{width:100%;min-height:42px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
select{padding-right:6px}
input:disabled,select:disabled{background:var(--sunk);color:var(--muted)}
label{display:grid;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
.err{color:var(--seal);font-size:13px;min-height:1.2em;margin:0}

/* 로그인 */
.login{max-width:420px;margin:48px auto 0;display:grid;gap:20px}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--muted);margin:0 0 6px;font-weight:600}
.login h1{font-family:var(--f-display);font-size:34px;line-height:1.2}
.lead{color:var(--muted);margin:10px 0 0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px}
.form{display:grid;gap:14px}

/* 상단 막대 */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding-block:10px;margin-bottom:20px}
.topbar .in{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.who{display:flex;align-items:baseline;gap:10px}
.who strong{font-size:17px}
.sid{font-family:var(--f-mono);color:var(--muted);font-size:14px}
.top-actions{display:flex;gap:6px}

/* 학생 화면 */
.status-row{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:16px}
.status-row h2{font-family:var(--f-display);font-size:26px}
.stamp{flex:none;width:76px;height:76px;border-radius:50%;display:grid;place-items:center;text-align:center;font-family:var(--f-display);font-size:15px;line-height:1.15;border:2px dashed var(--line);color:var(--muted);transform:rotate(-8deg)}
.stamp.on{border:3px double var(--seal);color:var(--seal);background:var(--seal-soft)}
.notice{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:14px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--surface)}
.notice.info{border-color:var(--accent);background:var(--accent-soft)}
.guide{margin-bottom:16px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.guide summary{cursor:pointer;padding:12px 14px;font-weight:600}
.guide .body{padding:0 14px 14px;overflow-x:auto}
.guide table{border-collapse:collapse;font-size:13px;min-width:520px}
.guide th,.guide td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.guide th{background:var(--sunk)}
.guide ul{margin:10px 0 0;padding-left:18px;font-size:13px}
.apps{display:grid;gap:12px}
.app{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:14px}
.app-h{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.app-h > div{min-width:0}
.univ{font-weight:700;font-size:17px}
.meta{color:var(--muted);font-size:13px;margin-top:2px}
.tags{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;flex:none}
.tag{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.tag.add{background:var(--accent-soft);color:var(--accent)}
.added-edit{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;flex:1}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.fld.off span{opacity:.6}
.fld small{font-weight:400;font-size:12px;color:var(--muted)}
.fld.wide{grid-column:1/-1}
.rankrow{display:flex;gap:6px}
.rankrow input{width:80px;flex:none;font-family:var(--f-mono)}
.app-f{display:flex;justify-content:flex-end}
.app.invalid{border-color:var(--seal)}
.add-row{margin-top:14px;display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.actionbar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.actionbar .in{max-width:820px;margin:0 auto;display:flex;gap:8px;align-items:center;justify-content:flex-end}
.actionbar .state{margin-right:auto;font-size:13px;color:var(--muted)}
.actionbar .state.dirty{color:var(--warn);font-weight:600}

/* 결과 표시 */
.pill{display:inline-block;padding:1px 9px;border-radius:999px;font-size:12.5px;font-weight:600;white-space:nowrap}
.p-ok{background:var(--ok-soft);color:var(--ok)}
.p-wait{background:var(--accent-soft);color:var(--accent)}
.p-bad{background:var(--bad-soft);color:var(--bad)}
.p-none{border:1px dashed var(--line);color:var(--muted)}

/* 모달 */
.modal{position:fixed;inset:0;z-index:20;background:rgb(10 14 20 / .45);display:grid;place-items:center;padding:16px}
.modal .card{width:min(400px,100%)}
.modal h3{font-size:18px;margin-bottom:12px}
.row-end{display:flex;gap:8px;justify-content:flex-end}

/* 관리자 */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:10px 14px;cursor:pointer;font-weight:600;color:var(--muted);white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-color:var(--accent)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:18px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.tile .k{font-size:12.5px;color:var(--muted);font-weight:600}
.tile .v{font-family:var(--f-mono);font-size:24px;font-variant-numeric:tabular-nums}
.tile .v small{font-size:14px;color:var(--muted)}
.filters{display:grid;grid-template-columns:2fr repeat(4,1fr) auto;gap:8px;margin-bottom:12px;align-items:end}
@media (max-width:860px){.filters{grid-template-columns:1fr 1fr}}
.tablebox{overflow:auto;max-height:70vh;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table.data{border-collapse:separate;border-spacing:0;width:100%;font-size:13.5px;font-variant-numeric:tabular-nums}
table.data th{position:sticky;top:0;background:var(--sunk);text-align:left;font-weight:600;color:var(--muted);padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
table.data th.sortable{cursor:pointer;user-select:none}
table.data th.sortable:hover{color:var(--ink)}
table.data th .arr{font-size:11px;margin-left:3px;color:var(--accent)}
table.data td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.data tr:last-child td{border-bottom:0}
table.data td.mono{font-family:var(--f-mono)}
table.data td.nowrap{white-space:nowrap}
.count{font-size:13px;color:var(--muted);margin:0 0 8px}
.pw{font-family:var(--f-mono)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:12px}
.drop{border:2px dashed var(--line);border-radius:14px;padding:24px;text-align:center;background:var(--surface)}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.import-sum{margin-top:16px;display:grid;gap:12px}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){.app,.tile{transition:border-color .15s}}
@media (max-width:520px){.status-row h2{font-size:22px}.stamp{width:64px;height:64px;font-size:13px}.actionbar .state{display:none}}
</style>
</head>
<body>
<main id="app"></main>
<div id="toast" hidden></div>
<div id="modal" hidden></div>

<script>
/* ============================================================
   설정: 배포할 때 Apps Script 웹 앱 주소를 넣습니다.
   ============================================================ */
const CONFIG = { API_URL: "https://script.google.com/macros/s/AKfycbzBg8VDcVGxb3Q4G48zW5rT8xmkvtSDeZiEILPdhofWSPrm0AaynA1wMhBF4t0CCWRrsg/exec" };

/* ---------- 입력 규칙 ---------- */
const OPT = {
  stage1: ["합격", "불합격"],
  final: ["합격", "불합격", "충원합격"],
  reason: ["미응시", "최저미충족", "불합격"],
  rankType: ["직접입력", "후보순위없음"],
  reg: ["Y", "N"]
};
const BASE_F = ["region","kind","univ","season","ttype","tbig","tdetail","field","major","quota"];
const RES_F = ["stage1","final","reason","rankType","rank","reg","note"];
const STAGE1_FAIL = "1단계 불합격";

// 서로 맞지 않는 값을 정리합니다 (Code.gs의 normalize_와 같은 규칙)
function normalize(a) {
  const x = { ...a };
  ["stage1","final","rankType","reg"].forEach(k => { if (x[k] && !OPT[k].includes(x[k])) x[k] = ""; });
  if (x.reason && !OPT.reason.includes(x.reason) && x.reason !== STAGE1_FAIL) x.reason = "";
  x.note = String(x.note ?? "").slice(0, 200);
  if (x.stage1 === "불합격") {
    x.final = "불합격"; x.reason = STAGE1_FAIL; x.rankType = "후보순위없음"; x.rank = ""; x.reg = "N";
    return x;
  }
  if (x.reason === STAGE1_FAIL) x.reason = "";
  if (x.final !== "불합격") x.reason = "";
  if (x.final !== "불합격" && x.final !== "충원합격") { x.rankType = ""; x.rank = ""; }
  x.rank = x.rankType === "직접입력" ? String(x.rank ?? "").replace(/\D/g, "").slice(0, 4) : "";
  if (x.final === "불합격") x.reg = "N";
  if (!x.final) x.reg = "";
  return x;
}

/* ---------- 공통 도구 ---------- */
const $ = s => document.querySelector(s);
const view = $("#app");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad2 = v => String(v ?? "").trim().padStart(2, "0");
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } },
  del(k) { try { localStorage.removeItem(k); } catch {} }
};
const nowStr = () => {
  const d = new Date(Date.now() + 9 * 3600e3);
  return d.toISOString().slice(0, 19).replace("T", " ");
};
const toMs = s => s ? Date.parse(s.replace(" ", "T") + (s.length === 16 ? ":00" : "") + "+09:00") || 0 : 0;
let toastTimer;
function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.hidden = true, 3200);
}
function pillCls(v) { return v === "합격" ? "p-ok" : v === "충원합격" ? "p-wait" : v === "불합격" ? "p-bad" : "p-none"; }
function pill(v) { return `<span class="pill ${pillCls(v)}">${esc(v || "미입력")}</span>`; }
function newId(p) { return p + Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4); }

/* ---------- 서버 호출 ---------- */
async function api(action, payload = {}) {
  if (!CONFIG.API_URL) throw new Error("서버 주소가 설정되지 않았습니다.");
  let res;
  try {
    res = await fetch(CONFIG.API_URL, { method: "POST", body: JSON.stringify({ action, ...payload }) });
  } catch {
    throw new Error("서버에 연결하지 못했습니다. 인터넷 연결을 확인하고 다시 시도하세요.");
  }
  if (!res.ok) throw new Error(`서버 응답 오류(${res.status})입니다. 잠시 뒤 다시 시도하세요.`);
  const j = await res.json().catch(() => ({ ok: false, error: "서버 응답을 읽지 못했습니다." }));
  if (!j.ok) throw new Error(j.error || "요청을 처리하지 못했습니다.");
  return j;
}
async function busy(btn, fn) {
  const label = btn ? btn.textContent : "";
  if (btn) { btn.disabled = true; btn.textContent = "처리 중…"; }
  try { return await fn(); }
  finally { if (btn && btn.isConnected) { btn.disabled = false; btn.textContent = label; } }
}


/* ============================================================
   상태
   ============================================================ */
const S = { token: null, student: null, apps: [], dirty: false };
const A = { token: null, students: [], apps: [], tab: "results", showPw: false,
  sort: { k: "sid", d: 1 }, f: { q: "", cls: "", final: "", sub: "" }, parsed: null };

window.addEventListener("beforeunload", e => { if (S.dirty) { e.preventDefault(); e.returnValue = ""; } });

/* ============================================================
   로그인
   ============================================================ */
function viewLogin() {
  S.token = null; S.student = null; S.dirty = false; A.token = null;
  view.innerHTML = `
  <section class="login">
    <div>
      <p class="eyebrow">2027학년도 대입 · 진학관리</p>
      <h1>합격 현황 입력</h1>
      <p class="lead">학번, 이름, 비밀번호로 들어가 원서를 낸 대학의 결과를 고르세요. 처음 비밀번호는 자신의 학번입니다.</p>
    </div>
    <form id="fLogin" class="card form" autocomplete="off" novalidate>
      <label>학번<input id="lgSid" inputmode="numeric" placeholder="예: 30101" maxlength="10" required></label>
      <label>이름<input id="lgName" maxlength="20" required></label>
      <label>비밀번호<input id="lgPw" type="password" maxlength="20" required></label>
      <p class="err" id="lgErr" role="alert"></p>
      <button class="btn primary" id="lgBtn">입장하기</button>
    </form>
    <button class="link" id="toAdmin">관리자 페이지</button>
  </section>`;
  $("#fLogin").addEventListener("submit", async e => {
    e.preventDefault();
    const sid = $("#lgSid").value.trim(), name = $("#lgName").value.trim(), pw = $("#lgPw").value;
    if (!sid || !name || !pw) { $("#lgErr").textContent = "학번, 이름, 비밀번호를 모두 입력하세요."; return; }
    try {
      const r = await busy($("#lgBtn"), () => api("studentLogin", { sid, name, pw }));
      S.token = r.token; S.student = r.student;
      loadStudentApps(r.apps);
      viewStudent();
    } catch (err) { $("#lgErr").textContent = err.message; }
  });
  $("#toAdmin").onclick = viewAdminLogin;
}

/* ============================================================
   학생 화면
   ============================================================ */
const draftKey = () => "admres_draft_" + S.student.sid;

function loadStudentApps(serverApps) {
  S.serverApps = serverApps;
  S.apps = serverApps.map(a => ({ ...a }));
  S.draftInfo = null; S.dirty = false;
  const d = store.get(draftKey());
  if (d && Array.isArray(d.apps) && d.savedMs > toMs(S.student.submittedAt)) {
    const ids = new Set(d.apps.map(a => a.id));
    const missingBase = serverApps.filter(a => a.src === "base" && !ids.has(a.id));
    const baseMap = Object.fromEntries(serverApps.map(a => [a.id, a]));
    S.apps = d.apps
      .filter(a => a.src === "added" || baseMap[a.id])
      .map(a => a.src === "base" ? { ...baseMap[a.id], ...Object.fromEntries(RES_F.map(k => [k, a[k] ?? ""])) } : a)
      .concat(missingBase.map(a => ({ ...a })));
    S.draftInfo = d.savedAt;
    S.dirty = true;
  }
}

function viewStudent() {
  const st = S.student;
  view.innerHTML = `
  <header class="topbar"><div class="wrap in">
    <div class="who"><span class="sid">${esc(st.sid)}</span><strong>${esc(st.name)}</strong></div>
    <div class="top-actions">
      <button class="btn ghost sm" id="btnPw">비밀번호 변경</button>
      <button class="btn ghost sm" id="btnOut">나가기</button>
    </div>
  </div></header>
  <section class="wrap">
    <div class="status-row">
      <div>
        <h2>지원 대학 결과</h2>
        <p class="muted small" id="subInfo"></p>
      </div>
      <div class="stamp" id="stamp"></div>
    </div>
    <div id="notices"></div>
    <details class="guide">
      <summary>입력 방법 보기</summary>

function sel(a, f, label, opts, { off = false, hint = "" } = {}) {
  const v = a[f] || "";
  const list = !v || opts.includes(v) ? opts : [v, ...opts];
  return `<label class="fld${off ? " off" : ""}"><span>${label}</span>
    <select id="${f}_${a.id}" data-f="${f}"${off ? " disabled" : ""}>
      <option value="">${off ? "—" : "선택"}</option>
      ${list.map(o => `<option${o === v ? " selected" : ""}>${esc(o)}</option>`).join("")}
    </select>${hint ? `<small>${hint}</small>` : ""}</label>`;
}

function notePh(a) {
  if (a.final === "충원합격") return "최종 발표까지의 순위 변화 (예: 12-0)";
  if (a.rankType === "후보순위없음") return "후보 순위가 없는 이유를 짧게 적어 주세요";
  return "필요하면 적어 주세요";
}

function renderApps() {

function markDirty() { S.dirty = true; renderStudentStatus(); }

function onAppChange(e) {
  const t = e.target; if (t.tagName !== "SELECT") return;
  const card = t.closest(".app"); const i = S.apps.findIndex(a => a.id === card.dataset.id);
  S.apps[i] = normalize({ ...S.apps[i], [t.dataset.f]: t.value });
  const focusId = t.id;
  card.outerHTML = appCard(S.apps[i]);
  document.getElementById(focusId)?.focus();
  if (t.dataset.f === "rankType" && S.apps[i].rankType === "직접입력") document.getElementById("rank_" + S.apps[i].id)?.focus();
  markDirty();
}
function onAppInput(e) {
  const t = e.target; if (t.tagName !== "INPUT") return;
  const card = t.closest(".app"); const a = S.apps.find(x => x.id === card.dataset.id);
  if (t.dataset.f === "rank") t.value = t.value.replace(/\D/g, "");
  a[t.dataset.f] = t.value;
  card.classList.remove("invalid");
  markDirty();
}
function onAppClick(e) {
  const b = e.target.closest("[data-del]"); if (!b) return;
  if (b.dataset.armed !== "1") { b.dataset.armed = "1"; b.textContent = "한 번 더 누르면 삭제"; setTimeout(() => { if (b.isConnected) { b.dataset.armed = ""; b.textContent = "이 원서 삭제"; } }, 4000); return; }
  S.apps = S.apps.filter(a => a.id !== b.dataset.del);
  renderApps(); markDirty();
}
function addApp() {
  const a = { id: newId("N"), src: "added", sid: S.student.sid, name: S.student.name };
  BASE_F.concat(RES_F).forEach(k => a[k] = "");
  a.season = "수시";
  S.apps.push(a); renderApps(); markDirty();
  document.getElementById("univ_" + a.id)?.focus();
}

function validate() {
  const bad = [];
  S.apps.forEach(a => {
    let msg = "";
    if (a.src === "added" && !String(a.univ).trim()) msg = "직접 추가한 원서의 대학명을 적어 주세요.";
    else if (a.rankType === "직접입력" && !a.rank) msg = `${a.univ}: 최초후보순위 숫자를 적어 주세요.`;
    if (msg) bad.push({ id: a.id, msg });
  });
  document.querySelectorAll(".app").forEach(c => c.classList.toggle("invalid", bad.some(b => b.id === c.dataset.id)));
  return bad;
}

function saveDraft() {
  S.apps = S.apps.map(normalize);
  const ok = store.set(draftKey(), { savedAt: nowStr(), savedMs: Date.now(), apps: S.apps });
  toast(ok ? "이 기기에 임시 저장했습니다. 선생님께는 아직 전달되지 않았습니다." : "이 브라우저에서는 임시 저장을 쓸 수 없습니다. 제출하기로 저장하세요.");
}

async function submitApps() {
  const bad = validate();
  if (bad.length) { toast(bad[0].msg); document.querySelector(".app.invalid")?.scrollIntoView({ behavior: "smooth", block: "center" }); return; }
  S.apps = S.apps.map(normalize);
  try {
    const r = await busy($("#btnSubmit"), () => api("submit", { token: S.token, apps: S.apps }));
    store.del(draftKey());
    S.student.submittedAt = r.submittedAt;
    S.serverApps = r.apps; S.apps = r.apps.map(a => ({ ...a }));
    S.dirty = false; S.draftInfo = null;
    renderNotices(); renderApps(); renderStudentStatus();
    toast("제출했습니다. 결과가 바뀌면 다시 들어와 고쳐서 제출하세요.");
  } catch (err) {
    if (/다시 로그인/.test(err.message)) { saveDraft(); toast("접속 시간이 끝나 이 기기에 임시 저장했습니다. 다시 로그인한 뒤 제출하세요."); }
    else toast(err.message);
  }
}

/* ----- 원서별 결과 ----- */
const FINAL_ORDER = { "합격": 0, "충원합격": 1, "불합격": 2, "": 3 };
const SORTS = {
  sid: { label: "학번" }, name: { label: "이름" }, univ: { label: "대학명" }, tdetail: { label: "전형" },
  major: { label: "모집단위" }, stage1: { label: "1단계" }, final: { label: "최종결과" }, reason: { label: "불합격사유" },
  rank: { label: "최초후보순위" }, reg: { label: "등록" }, note: { label: "비고" }, src: { label: "입력구분" },
  submittedAt: { label: "제출시각" }
};
const COLS = ["sid","name","univ","tdetail","major","stage1","final","reason","rank","reg","note","src","submittedAt"];
const clsOf = sid => sid.length >= 5 ? `${sid[0]}학년 ${+sid.slice(1, 3)}반` : "";

function cmp(a, b, k) {
  if (k === "final") return FINAL_ORDER[a.final || ""] - FINAL_ORDER[b.final || ""];
  if (k === "rank") {
    const va = a.rankType === "직접입력" ? +a.rank : a.rankType ? 1e6 : 1e7;
    const vb = b.rankType === "직접입력" ? +b.rank : b.rankType ? 1e6 : 1e7;
    return va - vb;
  }
  if (k === "submittedAt") {
    const va = A.stuMap[a.sid]?.submittedAt || "", vb = A.stuMap[b.sid]?.submittedAt || "";
    if (!va !== !vb) return va ? -1 : 1;
    return va.localeCompare(vb);
  }
  const va = String(a[k] ?? ""), vb = String(b[k] ?? "");
  if (!va !== !vb) return va ? -1 : 1;
  return va.localeCompare(vb, "ko", { numeric: true });
}

function adminRows() {
  const { q, cls, final, sub } = A.f;
  const qq = q.trim().toLowerCase();
  let rows = A.apps.filter(a => {
    const st = A.stuMap[a.sid] || {};
    if (cls && clsOf(a.sid) !== cls) return false;
    if (final === "미입력" ? a.final : final === "합격전체" ? !(a.final === "합격" || a.final === "충원합격") : final && a.final !== final) return false;
    if (sub === "제출" && !st.submittedAt) return false;
    if (sub === "미제출" && st.submittedAt) return false;
    if (qq && ![a.sid, a.name, a.univ, a.major, a.tdetail, a.note].join(" ").toLowerCase().includes(qq)) return false;
    return true;
  });
  const { k, d } = A.sort;
  // 빈 값은 오름차순·내림차순 모두 맨 뒤로
  const empty = a => k === "final" ? !a.final : k === "rank" ? !a.rankType
    : k === "submittedAt" ? !A.stuMap[a.sid]?.submittedAt : !String(a[k] ?? "");
  return rows.sort((a, b) => {
    const ea = empty(a), eb = empty(b);
    if (ea !== eb) return ea ? 1 : -1;
    const c = cmp(a, b, k) * d;
    if (c) return c;
    return a.sid.localeCompare(b.sid) || String(a.univ).localeCompare(String(b.univ), "ko");
  });
}

function renderResults() {
  const n = A.students.length, sub = A.students.filter(s => s.submittedAt).length;
  const cnt = v => A.apps.filter(a => a.final === v).length;
  const classes = [...new Set(A.students.map(s => clsOf(s.sid)).filter(Boolean))].sort((a, b) => a.localeCompare(b, "ko", { numeric: true }));
  $("#admBody").innerHTML = `
    <div class="tiles">
      <div class="tile"><div class="k">제출한 학생</div><div class="v">${sub}<small> / ${n}명</small></div></div>
      <div class="tile"><div class="k">원서</div><div class="v">${A.apps.length}<small>건</small></div></div>
      <div class="tile"><div class="k">합격</div><div class="v">${cnt("합격")}</div></div>
      <div class="tile"><div class="k">충원합격</div><div class="v">${cnt("충원합격")}</div></div>
      <div class="tile"><div class="k">불합격</div><div class="v">${cnt("불합격")}</div></div>
      <div class="tile"><div class="k">결과 미입력</div><div class="v">${A.apps.filter(a => !a.final).length}</div></div>
      <div class="tile"><div class="k">등록 Y</div><div class="v">${A.apps.filter(a => a.reg === "Y").length}</div></div>
    </div>
    <div class="filters">
      <label>검색<input id="fQ" placeholder="이름, 학번, 대학, 모집단위" value="${esc(A.f.q)}"></label>
      <label>반<select id="fCls"><option value="">전체</option>${classes.map(c => `<option${c === A.f.cls ? " selected" : ""}>${c}</option>`).join("")}</select></label>
      <label>최종결과<select id="fFinal">${["", "합격전체", "합격", "충원합격", "불합격", "미입력"].map(v => `<option value="${v}"${v === A.f.final ? " selected" : ""}>${v === "" ? "전체" : v === "합격전체" ? "합격+충원합격" : v}</option>`).join("")}</select></label>
      <label>제출 상태<select id="fSub">${["", "제출", "미제출"].map(v => `<option value="${v}"${v === A.f.sub ? " selected" : ""}>${v || "전체"}</option>`).join("")}</select></label>
      <label>정렬<select id="fSort">${COLS.map(c => `<option value="${c}"${c === A.sort.k ? " selected" : ""}>${SORTS[c].label}${A.sort.k === c ? (A.sort.d > 0 ? " ↑" : " ↓") : ""}</option>`).join("")}</select></label>
      <button class="btn primary" id="btnXlsx">엑셀 다운로드</button>
    </div>
    <p class="count" id="rowCount"></p>
    <div class="tablebox"><table class="data" id="resTable"></table></div>
    ${CONFIG.API_URL ? "" : `<p class="muted small">미리보기 화면에서는 파일 저장이 막혀 있어 다운로드가 되지 않을 수 있습니다. 실제 배포 주소에서는 진학관리 양식(학년~비고) 그대로 내려받습니다.</p>`}`;
  const rerender = () => renderResultTable();
  $("#fQ").oninput = e => { A.f.q = e.target.value; rerender(); };
  $("#fCls").onchange = e => { A.f.cls = e.target.value; rerender(); };
  $("#fFinal").onchange = e => { A.f.final = e.target.value; rerender(); };
  $("#fSub").onchange = e => { A.f.sub = e.target.value; rerender(); };
  $("#fSort").onchange = e => { A.sort = { k: e.target.value, d: 1 }; renderResults(); };

function renderResultTable() {
  const rows = adminRows();
  $("#rowCount").textContent = `${rows.length}건 표시 · 열 제목을 누르면 정렬이 바뀝니다`;
  const th = c => `<th class="sortable" data-k="${c}" aria-sort="${A.sort.k === c ? (A.sort.d > 0 ? "ascending" : "descending") : "none"}">${SORTS[c].label}${A.sort.k === c ? `<span class="arr">${A.sort.d > 0 ? "▲" : "▼"}</span>` : ""}</th>`;
  const rank = a => a.rankType === "직접입력" ? a.rank : a.rankType;
  const t = $("#resTable");
  t.innerHTML = `<thead><tr>${COLS.map(th).join("")}</tr></thead><tbody>${rows.map(a => {
    const st = A.stuMap[a.sid] || {};
    return `<tr>
      <td class="mono">${esc(a.sid)}</td><td class="nowrap">${esc(a.name)}</td><td>${esc(a.univ)}</td><td>${esc(a.tdetail || a.tbig)}</td><td>${esc(a.major)}</td>
      <td class="nowrap">${esc(a.stage1)}</td><td>${pill(a.final)}</td><td class="nowrap">${esc(a.reason)}</td><td class="mono nowrap">${esc(rank(a))}</td>
      <td class="mono">${esc(a.reg)}</td><td>${esc(a.note)}</td><td class="nowrap">${a.src === "added" ? `<span class="tag add">학생 추가</span>` : `<span class="tag">학교 제공</span>`}</td>
      <td class="mono nowrap">${st.submittedAt ? esc(st.submittedAt.slice(5, 16)) : `<span class="muted">미제출</span>`}</td></tr>`;
  }).join("") || `<tr><td colspan="${COLS.length}" class="muted">조건에 맞는 원서가 없습니다.</td></tr>`}</tbody>`;
  t.querySelector("thead").onclick = e => {
    const h = e.target.closest("[data-k]"); if (!h) return;
    A.sort = A.sort.k === h.dataset.k ? { k: h.dataset.k, d: -A.sort.d } : { k: h.dataset.k, d: 1 };
    const s = $("#fSort");
    s.innerHTML = COLS.map(c => `<option value="${c}"${c === A.sort.k ? " selected" : ""}>${SORTS[c].label}${A.sort.k === c ? (A.sort.d > 0 ? " ↑" : " ↓") : ""}</option>`).join("");
    renderResultTable();
  };
}

function exportXlsx() {
  if (typeof XLSX === "undefined") { toast("엑셀 도구를 불러오지 못했습니다. 인터넷 연결을 확인한 뒤 새로고침하세요."); return; }
  const rows = adminRows();
  const H = ["학년","반","번호","이름","지역","구분","대학명","모집시기","전형유형","전형명(대)","세부유형","계열","모집단위","모집인원","1단계","최종단계","불합격사유","최초후보순위","","등록여부","비고","입력구분"];
  const blank = H.map(() => "");
  const aoa = [H, blank, ...rows.map(a => {
    const s = A.stuMap[a.sid] || {};
    const g = s.grade || a.sid[0] || "", c = s.cls || String(+a.sid.slice(1, 3) || ""), n = s.num || String(+a.sid.slice(3) || "");
    return [g, c, n, a.name, a.region, a.kind, a.univ, a.season, a.ttype, a.tbig, a.tdetail, a.field, a.major, a.quota,
      a.stage1, a.final, a.reason, a.rankType, a.rank ? Number(a.rank) : "", a.reg, a.note, a.src === "added" ? "학생추가" : "학교제공"];
  })];
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  ws["!merges"] = H.map((h, i) => i === 17 ? { s: { r: 0, c: 17 }, e: { r: 1, c: 18 } } : i === 18 ? null : { s: { r: 0, c: i }, e: { r: 1, c: i } }).filter(Boolean);
  ws["!cols"] = [4,4,4,8,6,7,22,7,14,14,24,6,20,7,7,8,10,10,5,7,14,8].map(w => ({ wch: w }));
  const st = A.students.map(s => {
    const mine = A.apps.filter(a => a.sid === s.sid);
    return { "학번": s.sid, "이름": s.name, "원서 수": mine.length, "결과 입력": mine.filter(a => a.final).length,
      "합격(충원 포함)": mine.filter(a => a.final === "합격" || a.final === "충원합격").length,
      "제출시각": s.submittedAt || "미제출", "비밀번호 변경": s.pwChanged ? "변경함" : "학번 그대로" };
  });
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "진학관리");
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(st), "학생 제출현황");
  try { XLSX.writeFile(wb, `대입합격현황_${nowStr().slice(0, 10)}.xlsx`); toast(`${rows.length}건을 엑셀로 내보냈습니다.`); }
  catch { toast("이 화면에서는 파일을 저장할 수 없습니다. 실제 배포 주소에서 내려받으세요."); }
}

/* ----- 명렬·원서 올리기 ----- */
function renderImport() {
  $("#admBody").innerHTML = `
    <div class="drop" id="drop">
      <p><strong>진학관리 엑셀 파일을 끌어다 놓거나 골라 주세요.</strong></p>
      <p class="muted small">학년·반·번호·이름·대학명·세부유형·모집단위 등이 있는 양식을 그대로 읽습니다. 학번은 학년+반 2자리+번호 2자리(예: 3학년 1반 1번 → 30101)로 만듭니다.</p>
      <input type="file" id="fileIn" accept=".xlsx,.xls,.csv" style="max-width:320px;margin:8px auto 0">
    </div>
    <div id="impResult" class="import-sum"></div>`;
  const drop = $("#drop");
  drop.ondragover = e => { e.preventDefault(); drop.classList.add("over"); };
  drop.ondragleave = () => drop.classList.remove("over");
  drop.ondrop = e => { e.preventDefault(); drop.classList.remove("over"); if (e.dataTransfer.files[0]) readFile(e.dataTransfer.files[0]); };
  $("#fileIn").onchange = e => { if (e.target.files[0]) readFile(e.target.files[0]); };
  if (A.parsed) renderParsed();
}

function readFile(file) {
  if (typeof XLSX === "undefined") { toast("엑셀 도구를 불러오지 못했습니다. 새로고침한 뒤 다시 시도하세요."); return; }
  const fr = new FileReader();
  fr.onload = () => {
    try {
      const wb = XLSX.read(new Uint8Array(fr.result), { type: "array" });
      const p = parseWorkbook(wb);
      if (!p.apps.length && !p.students.length) throw new Error("학년·반·번호(또는 학번)와 이름 열을 찾지 못했습니다. 첫 줄의 열 제목을 확인하세요.");
      A.parsed = { ...p, file: file.name };
      renderParsed();
    } catch (err) { $("#impResult").innerHTML = `<div class="notice"><span class="err">${esc(err.message)}</span></div>`; }
  };
  fr.onerror = () => toast("파일을 읽지 못했습니다.");
  fr.readAsArrayBuffer(file);
}

function parseWorkbook(wb) {
  const students = new Map(), apps = [];
  for (const name of wb.SheetNames) {
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[name], { header: 1, defval: "", raw: false });
    let h = -1;
    for (let r = 0; r < Math.min(15, rows.length); r++) {
      const cells = rows[r].map(c => String(c).replace(/\s/g, ""));
      if ((cells.includes("이름") || cells.includes("성명")) && (cells.includes("학번") || cells.includes("번호"))) { h = r; break; }
    }
    if (h < 0) continue;
    const hdr = rows[h].map(c => String(c).replace(/\s/g, ""));
    const ix = (...names) => { for (const n of names) { const i = hdr.indexOf(n); if (i >= 0) return i; } return -1; };
    const ci = {
      sid: ix("학번"), grade: ix("학년"), cls: ix("반"), num: ix("번호"), name: ix("이름", "성명"),
      region: ix("지역"), kind: ix("구분"), univ: ix("대학명", "대학"), season: ix("모집시기"), ttype: ix("전형유형"),
      tbig: ix("전형명(대)", "전형명"), tdetail: ix("세부유형", "세부전형"), field: ix("계열"), major: ix("모집단위", "학과"),
      quota: ix("모집인원"), stage1: ix("1단계"), final: ix("최종단계", "최종결과"), reason: ix("불합격사유"),
      rankType: ix("최초후보순위"), reg: ix("등록여부"), note: ix("비고")
    };
    const rankNum = ci.rankType >= 0 && !hdr[ci.rankType + 1] ? ci.rankType + 1 : -1;
    const v = (row, i) => i >= 0 ? String(row[i] ?? "").trim().replace(/\.0$/, "") : "";
    for (let r = h + 1; r < rows.length; r++) {
      const row = rows[r];
      const nm = v(row, ci.name); if (!nm) continue;
      let sid = v(row, ci.sid).replace(/\D/g, "");
      const g = v(row, ci.grade), c = v(row, ci.cls), n = v(row, ci.num);
      if (!sid && g && c && n) sid = g + pad2(c) + pad2(n);
      if (!sid) continue;
      if (!students.has(sid)) students.set(sid, { sid, grade: g || sid[0], cls: c || String(+sid.slice(1, 3)), num: n || String(+sid.slice(3)), name: nm });
      const univ = v(row, ci.univ);
      if (!univ) continue;
      let rt = v(row, ci.rankType), rk = v(row, rankNum);
      if (/^\d+$/.test(rt)) { rk = rt; rt = "직접입력"; }
      apps.push({ sid, name: nm, region: v(row, ci.region), kind: v(row, ci.kind), univ, season: v(row, ci.season),
        ttype: v(row, ci.ttype), tbig: v(row, ci.tbig), tdetail: v(row, ci.tdetail), field: v(row, ci.field),
        major: v(row, ci.major), quota: v(row, ci.quota), stage1: v(row, ci.stage1), final: v(row, ci.final),
        reason: v(row, ci.reason), rankType: rt, rank: rk, reg: v(row, ci.reg), note: v(row, ci.note) });
    }
  }
  return { students: [...students.values()], apps };
}

function renderParsed() {
  const p = A.parsed;
  const per = {}; p.apps.forEach(a => per[a.sid] = (per[a.sid] || 0) + 1);
  $("#impResult").innerHTML = `
    <div class="notice info"><span><strong>${esc(p.file)}</strong> · 학생 ${p.students.length}명 · 원서 ${p.apps.length}건을 읽었습니다. 아래에서 확인한 뒤 반영하세요.</span></div>
    <div class="tablebox" style="max-height:340px"><table class="data">
      <thead><tr><th>학번</th><th>이름</th><th>원서 수</th><th>지원 대학</th></tr></thead>
      <tbody>${p.students.map(s => `<tr><td class="mono">${esc(s.sid)}</td><td class="nowrap">${esc(s.name)}</td><td class="mono">${per[s.sid] || 0}</td>
        <td>${esc(p.apps.filter(a => a.sid === s.sid).map(a => a.univ).join(", "))}</td></tr>`).join("")}</tbody>
    </table></div>
    <div class="toolbar">
      <span class="muted small">‘추가 반영’은 이미 있는 학생·원서(같은 대학·전형·모집단위)는 건너뜁니다. ‘전체 바꾸기’는 학생이 입력한 결과와 바꾼 비밀번호까지 모두 지웁니다.</span>
      <div style="display:flex;gap:8px">
        <button class="btn sm danger" id="impReplace">전체 바꾸기</button>
        <button class="btn primary" id="impMerge">추가 반영</button>
      </div>
    </div>`;
  const run = async (mode, btn) => {
    try {
      const r = await busy(btn, () => api("adminImport", { token: A.token, mode, students: p.students, apps: p.apps }));
      await loadAdmin();
      A.parsed = null; renderImport();
      $("#impResult").innerHTML = `<div class="notice info"><span>학생 ${r.addedStudents}명, 원서 ${r.addedApps}건을 새로 넣었습니다. 지금 전체 학생 ${r.totalStudents}명 · 원서 ${r.totalApps}건입니다. 새 학생의 처음 비밀번호는 학번입니다.</span></div>`;
    } catch (err) { toast(err.message); }
  };
  $("#impMerge").onclick = e => run("merge", e.currentTarget);
  $("#impReplace").onclick = e => {
    const b = e.currentTarget;
    if (b.dataset.armed !== "1") { b.dataset.armed = "1"; b.textContent = "정말 모두 지우고 바꾸기"; return; }
    run("replace", b);
  };
}
